<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Ori Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
:root{--bg:#2b2118;--wood:#8a5a2e;--wood2:#a06a2e;--ui:#c6c6c6;--ui2:#8b8b8b;--ui3:#555;--slot:#8b8b8b;--em:#3ad17a;--em2:#1f9d55;--gold:#ffcf4a;--red:#e2574c;--paper:#f6f1e4;--ink:#1d2340;--s:52px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:Rubik,'Noto Sans Hebrew',Arial,sans-serif;background:var(--bg)}
body{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),repeating-conic-gradient(from 0deg at 50% 50%,#6b4a2b 0 25%,#5e4026 0 50%) 0 0/56px 56px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
svg{display:block;width:100%;height:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:0 0 auto}
.top h1{font-size:26px;margin:0;flex:1;text-shadow:3px 3px 0 #000}
.blk{background:#6f6f6f;color:#fff;font-weight:700;font-size:20px;padding:10px 16px;border-radius:3px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.18),0 0 0 3px #000}
.blk.green{background:var(--em2)}
.blk.gold{background:#c9902a}
.blk:active{transform:translateY(2px)}
.gems{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:800;text-shadow:2px 2px 0 #000}
.gems i{width:30px;height:30px;display:block}
/* home */
#home .hero{text-align:center;padding:6px 0 0}
#home .hero h1{font-size:44px;margin:0;text-shadow:4px 4px 0 #000}
#home .hero small{display:block;font-size:18px;opacity:.8;margin-top:2px;letter-spacing:1px}
.cards{flex:1;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-content:center;padding:10px 24px 24px;overflow:auto}
.card{width:230px;height:270px;background:var(--ui);color:#222;border-radius:3px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 10px 12px;
  box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #fff,0 0 0 4px #000,0 10px 0 #0007}
.card .art{width:110px;height:110px;image-rendering:pixelated}
.card .ttl{font-size:30px;font-weight:800}
.card .sub{font-size:17px;color:#444;text-align:center;min-height:22px}
.card .score{display:flex;gap:4px}
.card .score i{width:14px;height:14px;background:#777;display:block}
.card .score i.on{background:var(--em2)}
.card.locked{filter:grayscale(1) brightness(.6)}
.card.locked::after{content:"🔒";position:absolute;top:8px;left:10px;font-size:28px}
.card.book{background:#d9c08a}
.card.book .sub{color:#5a4326}
.corner{position:fixed;bottom:12px;left:12px;display:flex;gap:10px}
.corner button{font-size:22px;padding:8px 12px}
/* play */
#play .mid{flex:1;display:flex;gap:16px;padding:0 16px;min-height:0}
.story{flex:1.25;display:flex;flex-direction:column;gap:10px;min-width:0}
.paper{background:var(--paper);color:var(--ink);border-radius:3px;padding:12px 18px;box-shadow:0 0 0 4px #000,inset -4px -4px 0 #d8ceb4;position:relative}
#lines{font-size:30px;font-weight:700;line-height:1.45}
#lines .q{color:#7a3d00}
#say{position:absolute;top:8px;left:8px;font-size:24px;padding:4px 8px;background:#0001;border-radius:4px}
.eqrow{display:flex;justify-content:center;align-items:center;gap:14px}
#eq{direction:ltr;font-size:56px;font-weight:800;text-shadow:3px 3px 0 #000;display:flex;align-items:center;gap:14px;white-space:nowrap}
#eq .box{min-width:92px;height:76px;background:var(--paper);color:var(--ink);text-shadow:none;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #000,inset 0 0 0 3px var(--gold);padding:0 10px}
#eq .box.good{box-shadow:0 0 0 4px #000,inset 0 0 0 4px var(--em)}
#eq .box.bad{animation:shake .35s}
#steps{direction:ltr;display:flex;justify-content:center;gap:16px;min-height:40px;font-size:28px;font-weight:800}
#steps span{background:#0008;padding:2px 14px;border-radius:3px;box-shadow:0 0 0 2px #000}
#steps span.ten{color:var(--gold)}
#feedback{text-align:center;font-size:28px;font-weight:800;min-height:38px;text-shadow:2px 2px 0 #000}
.pad{direction:ltr;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:560px;margin:0 auto;width:100%}
.pad button{height:60px;font-size:32px;font-weight:800;background:var(--ui);color:#222;border-radius:3px;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,0 0 0 3px #000}
.pad button:active{transform:translateY(2px)}
.pad .ok{background:var(--em2);color:#fff;box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #fff4,0 0 0 3px #000}
.pad .hint{background:#e8c25a}
.pad.off{opacity:.4;pointer-events:none}
#next{display:none;margin:0 auto;font-size:30px;padding:12px 34px}
/* station */
.station{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--ui);color:#333;border-radius:3px;box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #fff,0 0 0 4px #000;padding:12px;min-width:0}
.station h3{margin:0;font-size:22px;color:#3f3f3f}
.craft{direction:ltr;display:flex;align-items:center;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,var(--g));gap:4px}
.slot{width:var(--s);height:var(--s);background:var(--slot);box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff;position:relative;padding:5px}
.grid3 .slot{width:var(--g);height:var(--g)}
.slot .it{width:100%;height:100%}
.slot .ghost{opacity:.28;filter:grayscale(1)}
.slot .n{position:absolute;bottom:0;right:3px;font-size:calc(var(--s)*.38);font-weight:800;color:#fff;text-shadow:2px 2px 0 #3f3f3f;direction:ltr}
.out{--g:calc(var(--s)*1.5)}
.out .slot{width:calc(var(--g)*1.25);height:calc(var(--g)*1.25)}
.out .slot .n{font-size:calc(var(--g)*.42)}
.arrow{font-size:46px;color:#555}
.event{width:min(200px,30vh);height:min(200px,30vh);image-rendering:pixelated}
.station .cap{font-size:20px;font-weight:700;color:#444;text-align:center}
/* inventory */
.inv{flex:0 0 auto;margin:12px 16px 14px;background:var(--ui);border-radius:3px;box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #fff,0 0 0 4px #000;padding:10px 14px;display:flex;align-items:center;gap:18px;justify-content:center}
.rows{direction:ltr;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:3px}
.row .gap{width:12px}
.row .tag{width:calc(var(--s)*1.1);margin-left:10px;font-size:calc(var(--s)*.5);font-weight:800;color:var(--em2);text-align:center;opacity:0;transition:opacity .3s}
.row.full .tag{opacity:1}
.row.flash .slot{box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff,0 0 0 3px var(--gold)}
.change{display:flex;flex-direction:column;align-items:center;gap:4px;color:#333;font-weight:700;font-size:18px}
.change .slot{width:calc(var(--s)*1.3);height:calc(var(--s)*1.3)}
.change .slot .n{font-size:calc(var(--s)*.5)}
.change .n.plus{color:#7dff9f}.change .n.minus{color:#ffb0a8}
.ppips{display:flex;gap:5px}
.ppips i{width:16px;height:16px;background:#0007;display:block;box-shadow:0 0 0 2px #000}
.ppips i.on{background:var(--em)}.ppips i.miss{background:#d88a2a}.ppips i.cur{background:var(--gold)}
.fly{position:fixed;z-index:50;pointer-events:none;padding:5px}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* book */
#bookGrid{flex:1;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:flex-start;padding:10px 20px 24px;overflow:auto;--s:38px}
.rc{background:var(--ui);color:#333;border-radius:3px;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,0 0 0 3px #000;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;width:250px}
.rc .craft{gap:8px}.rc .arrow{font-size:28px}
.rc b{font-size:22px}
.rc.locked .craft{filter:brightness(0) opacity(.35)}
.rc.locked b{opacity:.5}
/* overlays */
#cele,#parent{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:80}
#cele.on,#parent.on{display:flex}
#cele .big{font-size:46px;font-weight:800;text-shadow:4px 4px 0 #000;text-align:center;line-height:1.4}
#celeArt{width:160px;height:160px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 20px;border-radius:4px;font-size:24px;font-weight:800;display:none;z-index:60;align-items:center;gap:10px;box-shadow:0 0 0 3px var(--gold)}
#toast i{width:40px;height:40px;display:block}
#parent .panel{background:#2d2d2d;border-radius:6px;padding:20px 24px;width:min(640px,92vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 4px #000}
#parent label{display:flex;justify-content:space-between;align-items:center;font-size:20px;gap:12px}
#parent input[type=checkbox]{width:28px;height:28px}
#parent select{font-size:18px}
#stats{font-size:17px;line-height:1.5;direction:rtl}
#stats .miss{direction:ltr;display:inline-block;background:#0006;padding:0 6px;margin:2px;border-radius:3px}
@media (orientation:portrait){
  #play .mid{flex-direction:column}
  .station{flex:0 0 auto}
  .event{width:120px;height:120px}
}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="top"><div style="flex:1"></div><div class="gems"><i class="gemIcon"></i><span class="gemN">0</span></div></div>
  <div class="hero"><h1>שֻׁלְחַן הָעֲבוֹדָה שֶׁל אוֹרִי</h1><small>Ori Math</small></div>
  <div class="cards" id="cards"></div>
  <div class="corner"><button class="blk" id="fsBtn" title="מסך מלא">⛶</button><button class="blk" id="parentBtn" title="להורים">⚙️</button></div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="top">
    <button class="blk" id="homeBtn">🏠</button>
    <h1 id="lvlTitle"></h1>
    <div class="ppips" id="pips"></div>
    <div class="gems"><i class="gemIcon"></i><span class="gemN">0</span></div>
  </div>
  <div class="mid">
    <div class="story">
      <div class="paper"><div id="lines"></div><button id="say" title="הקראה">🔊</button></div>
      <div class="eqrow"><div id="eq"></div></div>
      <div id="steps"></div>
      <div id="feedback"></div>
      <div class="pad" id="pad"></div>
      <button class="blk green" id="next">הַבָּא ◀</button>
    </div>
    <div class="station" id="station"></div>
  </div>
  <div class="inv">
    <div class="change" id="change"></div>
    <div class="rows" id="rows"></div>
  </div>
</section>

<!-- RECIPE BOOK -->
<section id="book" class="screen">
  <div class="top"><button class="blk" id="bookHome">🏠</button><h1>סֵפֶר הַמַּתְכּוֹנִים</h1><div class="gems" id="bookCount"></div></div>
  <div id="bookGrid"></div>
</section>

<div id="toast"></div>
<div id="cele"><div id="celeArt"></div><div class="big" id="celeText"></div><button class="blk green" id="celeOk" style="font-size:30px;padding:14px 34px">יֵשׁ!</button></div>
<div id="parent"><div class="panel">
  <h2 style="margin:0">להורים</h2>
  <label>לפתוח את כל השלבים <input type="checkbox" id="optUnlock"></label>
  <label>מהירות האנימציה
    <select id="optSpeed"><option value="1">רגילה</option><option value="1.6">איטית</option><option value="0.6">מהירה</option></select></label>
  <label>אנימציה אחרי כל תשובה נכונה <input type="checkbox" id="optAfter"></label>
  <div id="stats"></div>
  <div style="display:flex;gap:12px;justify-content:space-between">
    <button class="blk" id="resetBtn" style="background:#8a2b2b">איפוס התקדמות</button>
    <button class="blk green" id="parentClose">סגור</button>
  </div>
  <div style="font-size:14px;opacity:.7">נשמר במכשיר בלבד (ori.math.v1). לא נוגע באפליקציות הקריאה והכתיבה.</div>
</div></div>

<script src="items.js"></script>
<script>
"use strict";
/* =====================================================================
   DATA. Everything Ori reads is here, with full nikud.
   Numbers are shown as digits, so Hebrew number agreement never comes up.
   ===================================================================== */

// Inventory items: plural name (kid-style Minecraft Hebrew) and the verb for getting more.
const NAMES = {
  cobble:{p:"אֲבָנִים", get:"חָפַרְתָּ"}, coal:{p:"פֶּחָם", get:"חָפַרְתָּ"}, iron:{p:"בַּרְזֶל", get:"חָפַרְתָּ"},
  gold:{p:"זָהָב", get:"חָפַרְתָּ"}, diamond:{p:"דַּיְמוֹנְדִּים", get:"חָפַרְתָּ"}, sand:{p:"חוֹל", get:"חָפַרְתָּ"},
  log:{p:"בּוּלֵי עֵץ", get:"כָּרַתָּ"}, apple:{p:"תַּפּוּחִים", get:"קָטַפְתָּ"}, wheat:{p:"חִטָּה", get:"קָצַרְתָּ"},
  potato:{p:"תַּפּוּדִים", get:"אָסַפְתָּ"}, emerald:{p:"אֶמֶרַלְדִּים"}, bone:{p:"עֲצָמוֹת"}, arrow:{p:"חִצִּים"},
  planks:{p:"קְרָשִׁים"}, stick:{p:"מַקְלוֹת"}, torch:{p:"לַפִּידִים"}, ladder:{p:"סֻלָּמוֹת"}, door:{p:"דְּלָתוֹת"},
  water:{p:"דְּלָיֵי מַיִם"}, string:{p:"חוּטִים"}, bread:{p:"לֶחֶם"},
};

// Real crafting recipes (3x3 grid, read row by row; "." = empty).
// use = the ingredient that comes out of Ori's inventory in "how many are left?" exercises.
// from = how it is made, for "you made N more" exercises.
const RECIPES = {
  planks: {name:"קְרָשִׁים",      grid:"....L....", key:{L:"log"},  out:"planks", n:4, from:"מִבּוּל עֵץ אֶחָד"},
  sticks: {name:"מַקְלוֹת",       grid:".P..P....", key:{P:"planks"}, out:"stick", n:4, use:"planks", obj:"4 מַקְלוֹת", from:"מִ־2 קְרָשִׁים"},
  table:  {name:"שֻׁלְחַן עֲבוֹדָה", grid:"PP.PP....", key:{P:"planks"}, out:"table", n:1, use:"planks", obj:"שֻׁלְחַן עֲבוֹדָה"},
  torch:  {name:"לַפִּידִים",     grid:".C..S....", key:{C:"coal",S:"stick"}, out:"torch", n:4, from:"מִפֶּחָם וּמַקֵּל"},
  chest:  {name:"תֵּבָה",         grid:"PPPP.PPPP", key:{P:"planks"}, out:"chest", n:1, use:"planks", obj:"תֵּבָה"},
  furnace:{name:"תַּנּוּר",       grid:"CCCC.CCCC", key:{C:"cobble"}, out:"furnace", n:1, use:"cobble", obj:"תַּנּוּר"},
  bread:  {name:"לֶחֶם",          grid:"...WWW...", key:{W:"wheat"}, out:"bread", n:1, use:"wheat", obj:"לֶחֶם"},
  bucket: {name:"דְּלִי",          grid:"...I.I.I.", key:{I:"iron"}, out:"bucket", n:1, use:"iron", obj:"דְּלִי"},
  pickaxe:{name:"פִּיקְאַקְס",     grid:"III.S..S.", key:{I:"iron",S:"stick"}, out:"pickaxe", n:1, use:"iron", obj:"פִּיקְאַקְס"},
  sword:  {name:"חֶרֶב",          grid:".I..I..S.", key:{I:"iron",S:"stick"}, out:"sword", n:1, use:"iron", obj:"חֶרֶב"},
  ladder: {name:"סֻלָּמוֹת",       grid:"S.SSSSS.S", key:{S:"stick"}, out:"ladder", n:3, use:"stick", obj:"3 סֻלָּמוֹת", from:"מִ־7 מַקְלוֹת"},
  boat:   {name:"סִירָה",         grid:"...P.PPPP", key:{P:"planks"}, out:"boatw", n:1, use:"planks", obj:"סִירָה"},
  door:   {name:"דְּלָתוֹת",       grid:"PP.PP.PP.", key:{P:"planks"}, out:"door", n:3, use:"planks", obj:"3 דְּלָתוֹת", from:"מִ־6 קְרָשִׁים"},
  bow:    {name:"קֶשֶׁת",          grid:".SFS.F.SF", key:{S:"stick",F:"string"}, out:"bow", n:1, use:"string", obj:"קֶשֶׁת"},
  gapple: {name:"תַּפּוּחַ זָהָב",   grid:"GGGGAGGGG", key:{G:"gold",A:"apple"}, out:"gapple", n:1, use:"gold", obj:"תַּפּוּחַ זָהָב"},
};
const RECIPE_ORDER = ["planks","sticks","table","torch","chest","furnace","bread","bucket","pickaxe","sword","ladder","boat","door","bow","gapple"];
const useCount = r => [...r.grid].filter(c => r.key[c] === r.use).length;

const LEVELS = {
  1:{name:"עַד 10", sub:"חִבּוּר וְחִסּוּר", rows:1, art:"planks"},
  2:{name:"עַד 20", sub:"בְּלִי לַעֲבֹר אֶת הָ־10", rows:2, art:"chest"},
  3:{name:"מֵעַל 10", sub:"מְמַלְּאִים 10 וּמַמְשִׁיכִים", rows:2, art:"diamond"},
};
const ROUND = 8;

// Which (a, b) pairs a level allows.
function pairOk(lvl, op, a, b){
  if(op==="fill") return (lvl===1||lvl===3) && a>=1 && a<=9 && b===10-a;
  if(op==="+"){ const s=a+b;
    if(lvl===1) return a>=1 && b>=1 && s<=10;
    if(lvl===2) return a>=10 && b>=1 && (a%10)+b<=9;              // 13 + 4: stays inside the second ten
    if(lvl===3) return a>=2 && a<=9 && b>=2 && b<=9 && s>=11;      // 8 + 5: fill the ten, then go on
  } else { const d=a-b;
    if(lvl===1) return a>=2 && a<=10 && b>=1 && d>=1;
    if(lvl===2) return a>=11 && a<=20 && b>=1 && d>=10;            // 17 - 5: stays above 10
    if(lvl===3) return a>=11 && a<=18 && b>=2 && b<=9 && d>=1 && d<=9; // 14 - 6: back to 10, then below
  }
  return false;
}

// Exercise templates. kind: "event" (a big picture does it) or "craft" (the crafting table does it).
const MINE = ["cobble","iron","gold","diamond","log","apple","wheat","potato"];
const TEMPLATES = [];
MINE.forEach(id => TEMPLATES.push({op:"+", kind:"event", item:id, icon:id==="log"?"log":id==="apple"||id==="wheat"||id==="potato"?id:"pickaxe",
  cap: NAMES[id].get==="חָפַרְתָּ" ? "חוֹפְרִים בַּמִּכְרֶה" : "אוֹסְפִים",
  lines:(a,b)=>[`יֵשׁ לְךָ ${a} ${NAMES[id].p}.`, `${NAMES[id].get} עוֹד ${b}.`], q:"כַּמָּה יֵשׁ לְךָ עַכְשָׁו?"}));
TEMPLATES.push(
  {op:"+", kind:"event", item:"bone", icon:"dog", cap:"צָ׳ארְלִי", lines:(a,b)=>[`צָ׳ארְלִי הֵבִיא לְךָ ${a} עֲצָמוֹת.`, `אַחַר כָּךְ הוּא הֵבִיא עוֹד ${b}.`], q:"כַּמָּה עֲצָמוֹת יֵשׁ לְךָ?"},

  {op:"+", kind:"event", item:"emerald", icon:"villager", cap:"הַכַּפְרִי", lines:(a,b)=>[`יֵשׁ לְךָ ${a} אֶמֶרַלְדִּים.`, `מָכַרְתָּ חִטָּה לַכַּפְרִי, וְהוּא נָתַן לְךָ ${b}.`], q:"כַּמָּה אֶמֶרַלְדִּים יֵשׁ לְךָ?"},
  {op:"-", kind:"event", item:"water", icon:"water", cap:"אוֹי! נִשְׁפָּךְ", spill:true, lines:(a,b)=>[`יֵשׁ לְךָ ${a} דְּלָיֵי מַיִם.`, `אוֹי! ${b} נִשְׁפְּכוּ.`], q:"כַּמָּה נִשְׁאֲרוּ?"},
  {op:"-", kind:"event", item:"cobble", icon:"creeper", cap:"קְרִיפֶּר!", burst:true, lines:(a,b)=>[`יֵשׁ לְךָ ${a} אֲבָנִים.`, `קְרִיפֶּר הִתְפּוֹצֵץ, וְ־${b} אֲבָנִים עָפוּ!`], q:"כַּמָּה נִשְׁאֲרוּ?"},
  {op:"-", kind:"event", item:"bone", icon:"dog", cap:"צָ׳ארְלִי", lines:(a,b)=>[`יֵשׁ לְךָ ${a} עֲצָמוֹת.`, `נָתַתָּ לְצָ׳ארְלִי ${b}.`], q:"כַּמָּה נִשְׁאֲרוּ?"},
  {op:"-", kind:"event", item:"emerald", icon:"villager", cap:"הַכַּפְרִי", lines:(a,b)=>[`יֵשׁ לְךָ ${a} אֶמֶרַלְדִּים.`, `שִׁלַּמְתָּ לַכַּפְרִי ${b} אֶמֶרַלְדִּים.`], q:"כַּמָּה נִשְׁאֲרוּ?"},
);
// "You made N more": the recipe decides how many (4 planks from a log, 4 torches, 3 ladders...)
["planks","sticks","torch","ladder","door"].forEach(rid => { const r=RECIPES[rid];
  TEMPLATES.push({op:"+", kind:"craft", recipe:rid, make:true, item:r.out, b:r.n,

Object.keys(RECIPES).forEach(rid => { const r=RECIPES[rid]; if(!r.use) return;
  TEMPLATES.push({op:"-", kind:"craft", recipe:rid, item:r.use, b:useCount(r),

// Make-a-ten warm-up (levels 1 and 3)
["planks","cobble","emerald","torch","apple"].forEach(id => TEMPLATES.push({op:"fill", kind:"event", item:id, icon:"chest", cap:"מְמַלְּאִים שׁוּרָה",
  lines:(a)=>[`בַּשּׁוּרָה יֵשׁ 10 מְקוֹמוֹת.`, `יֵשׁ בָּהּ ${a} ${NAMES[id].p}.`], q:"כַּמָּה חֲסֵרִים כְּדֵי לְמַלֵּא אֶת הַשּׁוּרָה?"}));

/* ===================== storage ===================== */
const KEY="ori.math.v1";
const blank=()=>({gems:0, best:{}, done:{}, recipes:{}, log:[], unlockAll:false, speed:1, animAfter:true});
let S; try{ S=Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ S=blank(); }
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const unlocked=l=> l===1 || S.unlockAll || !!S.done[l-1];

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=arr=>arr[rnd(arr.length)];
const sleep=ms=>new Promise(r=>setTimeout(r, ms*(S.speed||1)));
const icon=id=>`<div class="it">${ITEMS[id]||""}</div>`;
document.querySelectorAll(".gemIcon").forEach(e=>e.innerHTML=ITEMS.emerald);
function gemsUI(){ document.querySelectorAll(".gemN").forEach(e=>e.textContent=S.gems); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); }
function toast(html, ms=1800){ const t=$("#toast"); t.innerHTML=html; t.style.display="flex"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none", ms); }

function sizeUI(){
  const W=innerWidth, H=innerHeight;
  const s=Math.max(34, Math.min(64, (W-200)/12.2, H*(H>W?0.055:0.075)));
  document.documentElement.style.setProperty("--s", s+"px");
}
addEventListener("resize", sizeUI); sizeUI();

/* ===================== home ===================== */
function renderHome(){
  gemsUI();
  const c=$("#cards"); c.innerHTML="";
  [1,2,3].forEach(l=>{ const L=LEVELS[l], ok=unlocked(l), best=S.best[l]||0;

    d.onclick=()=>{ if(ok) startRound(l); else toast("🔒 קֹדֶם מְסַיְּמִים אֶת הַשָּׁלָב הַקּוֹדֵם"); };

/* ===================== recipe book ===================== */
function craftHTML(rid, opts={}){ const r=RECIPES[rid];
  const cells=[...r.grid].map((ch,i)=>{ const id=r.key[ch];
    if(!id) return `<div class="slot" data-i="${i}"></div>`;
    const ghost = opts.ghostUse && id===r.use;
    return `<div class="slot" data-i="${i}" data-id="${id}">${ghost?`<div class="it ghost">${ITEMS[id]}</div>`:(opts.emptyAll?"":icon(id))}</div>`; }).join("");
  return `<div class="craft" style="--g:${opts.g||"var(--s)"}"><div class="grid3">${cells}</div><div class="arrow">➜</div>
    <div class="out"><div class="slot" id="${opts.outId||""}">${opts.hideOut?"":icon(r.out)+(r.n>1?`<span class="n">${r.n}</span>`:"")}</div></div></div>`;
}
function renderBook(){
  const g=$("#bookGrid"); g.innerHTML="";
  RECIPE_ORDER.forEach(rid=>{ const has=!!S.recipes[rid];
    const d=document.createElement("div"); d.className="rc"+(has?"":" locked");
    d.innerHTML=craftHTML(rid)+`<b>${has?RECIPES[rid].name:"?"}</b>`; g.appendChild(d); });
  $("#bookCount").textContent=`${Object.keys(S.recipes).length} / ${RECIPE_ORDER.length}`;
  show("book");
}
$("#bookHome").onclick=()=>{ renderHome(); show("home"); };

/* ===================== round ===================== */
let R=null, Q=null, busy=false;

function makeQuestion(lvl, avoid){
  for(let tries=0; tries<200; tries++){
    // weights: fill is a short warm-up, recipes are the heart of it
    let pool=TEMPLATES.filter(t=> t.op!=="fill" || lvl!==2);
    const want = Math.random()<0.5 ? "craft" : "event";
    let t=pick(pool.filter(x=>x.kind===want));
    if(t.op==="fill" && Math.random()<0.6) continue;
    const pairs=[];
    for(let a=0;a<=20;a++) for(let b=1;b<=20;b++){
      if(t.b && b!==t.b) continue;
      if(t.op==="fill" ? pairOk(lvl,"fill",a,b) : pairOk(lvl,t.op,a,b)) pairs.push([a,b]);
    }
    if(!pairs.length) continue;
    const [a,b]=pick(pairs);
    if(avoid && avoid.some(q=>q.t===t || (q.a===a && q.b===b && q.t.op===t.op))) continue;
    const ans = t.op==="+"? a+b : t.op==="-"? a-b : b;
    return {t, a, b, ans, lvl};
  }
}

function startRound(lvl){
  R={lvl, i:0, qs:[], results:[]};
  for(let i=0;i<ROUND;i++) R.qs.push(makeQuestion(lvl, R.qs.slice(-3)));
  // at least one make-a-ten warm-up first in level 3
  if(lvl===3){ const f=TEMPLATES.filter(t=>t.op==="fill"); const t=pick(f); const a=2+rnd(7); R.qs[0]={t,a,b:10-a,ans:10-a,lvl}; }
  $("#lvlTitle").textContent=LEVELS[lvl].name;
  show("play"); sizeUI(); loadQuestion();
}

function pipsUI(){ $("#pips").innerHTML=R.qs.map((_,i)=>`<i class="${i<R.results.length?(R.results[i]?"on":"miss"):i===R.i?"cur":""}"></i>`).join(""); }

function loadQuestion(){
  Q=Object.assign({}, R.qs[R.i], {typed:"", tries:0, hinted:false, animated:false, t0:Date.now()});
  const t=Q.t; Q.bridge = t.op!=="fill" && ((t.op==="+" && Q.a<10 && Q.a+Q.b>10) || (t.op==="-" && Q.a>10 && Q.a-Q.b<10));
  pipsUI(); gemsUI();
  $("#lines").innerHTML=t.lines(Q.a,Q.b).map(l=>`<div>${l}</div>`).join("")+`<div class="q">${t.q}</div>`;
  $("#feedback").textContent=""; $("#steps").innerHTML="";
  $("#next").style.display="none"; $("#pad").style.display=""; $("#pad").classList.remove("off");
  renderStation(); renderInventory(); renderChange(); eqUI();
}

function eqUI(final){
  const t=Q.t, box=`<span class="box ${final?"good":""}" id="ansBox">${final?Q.ans:(Q.typed||"?")}</span>`;
  $("#eq").innerHTML = t.op==="fill" ? `<span>${Q.a}</span><span>+</span>${box}<span>=</span><span>10</span>`
    : `<span>${Q.a}</span><span>${t.op==="+"?"+":"−"}</span><span>${Q.b}</span><span>=</span>${box}`;
}

/* ---------- station (crafting table or event picture) ---------- */
function renderStation(){
  const t=Q.t, st=$("#station");
  if(t.kind==="craft"){
    const r=RECIPES[t.recipe];
    st.innerHTML=`<h3>שֻׁלְחַן עֲבוֹדָה · ${r.name}</h3>`+
      craftHTML(t.recipe, {g:"calc(var(--s)*1.3)", ghostUse:!t.make, hideOut:true, outId:"outSlot"})+
      `<div class="cap">${t.make?`מַתְכּוֹן: ${r.n} ${NAMES[r.out].p}`:`צָרִיךְ ${Q.b} ${NAMES[r.use].p}`}</div>`;
    if(t.make){ const o=$("#outSlot"); o.innerHTML=`<div class="it ghost">${ITEMS[r.out]}</div><span class="n">${r.n}</span>`; }
  } else {
    st.innerHTML=`<div class="event" id="evIcon">${ITEMS[t.icon]}</div><div class="cap">${t.cap}</div>`;
  }
}

/* ---------- inventory: rows of 10 (5 + 5), like a ten-frame ---------- */
let slots=[];
function renderInventory(){
  const rows=LEVELS[Q.lvl].rows, el=$("#rows"); el.innerHTML=""; slots=[];
  for(let r=0;r<rows;r++){ const row=document.createElement("div"); row.className="row";
    for(let i=0;i<10;i++){ if(i===5){ const g=document.createElement("div"); g.className="gap"; row.appendChild(g); }
      const s=document.createElement("div"); s.className="slot"; row.appendChild(s); slots.push(s); }
    const tag=document.createElement("div"); tag.className="tag"; tag.textContent="10"; row.appendChild(tag);
    el.appendChild(row); }
  setCount(Q.a);
}
function setCount(n){ slots.forEach((s,i)=>s.innerHTML= i<n? icon(Q.t.item):""); rowsFull(); }
function rowsFull(){ document.querySelectorAll("#rows .row").forEach((row,r)=>{ const full=[...row.querySelectorAll(".slot")].every(s=>s.innerHTML); row.classList.toggle("full", full); }); }
function renderChange(left){
  const t=Q.t, el=$("#change");
  if(left===undefined) left = t.op==="fill" ? null : Q.b;
  const sign = t.op==="-" ? "−" : "+";
  const label = t.op==="fill" ? "חָסֵר" : t.op==="+" ? "מוֹסִיפִים" : "מוֹרִידִים";
  const txt = left===null ? "?" : left===0 ? "" : sign+left;
  el.innerHTML=`<div class="slot" id="chgSlot">${left===0?"":icon(t.item)}<span class="n ${t.op==="-"?"minus":"plus"}">${txt}</span></div><div>${label}</div>`;
}

/* ---------- flying items ---------- */
function fly(fromEl, toEl, id, mode){
  const a=fromEl.getBoundingClientRect(), s=slots[0].getBoundingClientRect();
  const size=s.width;
  const d=document.createElement("div"); d.className="fly"; d.innerHTML=icon(id);
  Object.assign(d.style,{width:size+"px",height:size+"px",left:(a.left+a.width/2-size/2)+"px",top:(a.top+a.height/2-size/2)+"px"});
  document.body.appendChild(d);
  let frames;
  if(mode==="spill") frames=[{transform:"none",opacity:1},{transform:`translate(${(Math.random()-.5)*60}px, ${size*0.9}px) rotate(160deg)`,opacity:.9,offset:.6},{transform:`translate(${(Math.random()-.5)*90}px, ${size*2.2}px) rotate(200deg)`,opacity:0}];
  else if(mode==="burst"){ const ang=Math.random()*Math.PI*2, r=size*3; frames=[{transform:"none",opacity:1},{transform:`translate(${Math.cos(ang)*r}px, ${Math.sin(ang)*r-size}px) rotate(${rnd(720)-360}deg) scale(.6)`,opacity:0}]; }
  else { const b=toEl.getBoundingClientRect();
    const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2);
    frames=[{transform:"none"},{transform:`translate(${dx*.5}px, ${dy*.5-40}px) scale(1.15)`},{transform:`translate(${dx}px, ${dy}px) scale(${Math.min(1.3,b.width/size)})`}]; }
  const anim=d.animate(frames,{duration:(mode==="spill"||mode==="burst"?650:420)*(S.speed||1), easing:"ease-in-out", fill:"forwards"});
  return anim.finished.then(()=>d.remove());
}
function step(html, cls){ const s=document.createElement("span"); s.innerHTML=html; if(cls) s.className=cls; $("#steps").appendChild(s); }
async function flashRow(r){ const row=document.querySelectorAll("#rows .row")[r]; if(!row) return; row.classList.add("flash"); await sleep(700); row.classList.remove("flash"); }

/* ---------- the explanation animation ---------- */
async function runAnim(final){
  busy=true; $("#pad").classList.add("off");
  const t=Q.t, it=t.item; let cur=Q.a; const A=Q.a, B=Q.b;
  setCount(A); renderChange(); $("#steps").innerHTML="";
  const ans = final ? Q.ans : "?";
  if(t.op==="+" || t.op==="fill"){
    let src;
    if(t.kind==="craft"){ // ingredients go in, the output comes out, then lands in the inventory
      const r=RECIPES[t.recipe], out=$("#outSlot");
      document.querySelectorAll("#station .grid3 .it").forEach(e=>{ e.animate([{opacity:1},{opacity:0,transform:"scale(.4)"}],{duration:400,fill:"forwards"}); });
      await sleep(450); out.innerHTML=icon(r.out)+`<span class="n">${r.n}</span>`; out.classList.add("pop"); await sleep(500); src=out;
    } else src=$("#evIcon");
    for(let i=0;i<B;i++){
      if(Q.bridge && cur===10){ step(`${A} + ${10-A} = 10`,"ten"); await flashRow(0); }
      const target=slots[cur];
      await fly(src, target, it);
      target.innerHTML=icon(it); target.classList.add("pop"); setTimeout(()=>target.classList.remove("pop"),400);
      cur++; rowsFull();
      renderChange(t.op==="fill" ? i+1 : B-i-1);
      if(t.kind==="craft"){ const out=$("#outSlot"); const left=B-i-1; out.innerHTML= left? icon(t.item)+(left>1?`<span class="n">${left}</span>`:""):""; }
      await sleep(110);
    }
    if(t.op==="fill"){ await flashRow(0); step(`${A} + ${final?B:"?"} = 10`,"ten"); }
    else if(Q.bridge){ step(`10 + ${A+B-10} = ${ans}`); }
    else if(cur===10||cur===20) await flashRow(cur/10-1);
  } else {
    const targets = t.kind==="craft" ? [...document.querySelectorAll("#station .grid3 .slot")].filter(s=>s.dataset.id===RECIPES[t.recipe].use) : null;
    for(let i=0;i<B;i++){
      if(Q.bridge && cur===10){ step(`${A} − ${A-10} = 10`,"ten"); await flashRow(0); }
      const from=slots[cur-1];
      from.innerHTML=""; cur--; rowsFull();
      if(targets){ await fly(from, targets[i], it); targets[i].innerHTML=icon(it); }
      else if(t.spill || t.burst){ fly(from, null, it, t.spill?"spill":"burst"); await sleep(t.spill?260:180); }
      else await fly(from, $("#evIcon"), it);
      renderChange(B-i-1);
      await sleep(90);
    }
    if(targets){ await sleep(300); const r=RECIPES[t.recipe], out=$("#outSlot");
      targets.forEach(s=>s.animate([{opacity:1},{opacity:.3}],{duration:300,fill:"forwards"}));
      out.innerHTML=icon(r.out)+(r.n>1?`<span class="n">${r.n}</span>`:""); out.classList.add("pop"); }
    if(t.spill||t.burst) await sleep(500);
    if(Q.bridge) step(`10 − ${B-(A-10)} = ${ans}`);
  }
  Q.animated=true; busy=false; $("#pad").classList.remove("off");
}

/* ---------- keypad ---------- */
function buildPad(){
  const p=$("#pad"); p.innerHTML="";
  const add=(txt,cls,fn)=>{ const b=document.createElement("button"); b.textContent=txt; if(cls) b.className=cls; b.onclick=fn; p.appendChild(b); };
  [1,2,3,4,5].forEach(n=>add(n,"",()=>type(n)));
  add("⌫","",()=>{ Q.typed=Q.typed.slice(0,-1); eqUI(); });
  [6,7,8,9,0].forEach(n=>add(n,"",()=>type(n)));
  add("✓","ok",check);
  const h=document.createElement("button"); h.className="hint"; h.textContent="💡 תַּרְאֶה לִי"; h.style.gridColumn="1 / -1"; h.style.fontSize="24px";
  h.onclick=async()=>{ if(busy) return; Q.hinted=true; await runAnim(false); }; p.appendChild(h);
}
function type(n){ if(busy) return; if(Q.typed.length>=2) Q.typed=""; Q.typed+=String(n); if(Q.typed.length===2 && Q.typed[0]==="0") Q.typed=String(n); eqUI(); }

async function check(){
  if(busy || !Q.typed) return;
  const v=parseInt(Q.typed,10);
  logAnswer(v);
  if(v===Q.ans){
    const first = Q.tries===0 && !Q.hinted;
    R.results[R.i] = first;
    if(first){ S.gems++; gemsUI(); }
    let newRecipe=null;
    if(Q.t.recipe && !S.recipes[Q.t.recipe]){ S.recipes[Q.t.recipe]=1; newRecipe=Q.t.recipe; }
    save();
    $("#feedback").textContent = pick(["נָכוֹן!","יֵשׁ! נָכוֹן!","מְעֻלֶּה, אוֹרִי!","כׇּל הַכָּבוֹד!"]) + (first?" +1":"");
    eqUI(true);
    $("#pad").style.display="none";
    if(S.animAfter || Q.animated){ await runAnim(true); eqUI(true); }
    if(newRecipe) toast(`<i>${ITEMS[RECIPES[newRecipe].out]}</i> מַתְכּוֹן חָדָשׁ: ${RECIPES[newRecipe].name}`, 2600);
    $("#next").style.display="block";
  } else {
    Q.tries++;
    const b=$("#ansBox"); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
    if(Q.tries===1){
      $("#feedback").textContent="כִּמְעַט. בּוֹא נִרְאֶה בְּיַחַד.";
      await sleep(600); Q.typed=""; eqUI(); await runAnim(false);
      $("#feedback").textContent="עַכְשָׁו נַסֵּה שׁוּב.";
    } else {
      R.results[R.i]=false; save();
      $("#feedback").textContent=`הַתְּשׁוּבָה הִיא ${Q.ans}.`;
      eqUI(true); $("#pad").style.display="none";
      await runAnim(true);
      $("#next").style.display="block";
    }
  }
}
$("#next").onclick=()=>{ if(busy) return; R.i++; if(R.i>=ROUND) endRound(); else loadQuestion(); };

function logAnswer(v){
  S.log.push({d:Date.now(), l:Q.lvl, op:Q.t.op, a:Q.a, b:Q.b, ans:Q.ans, v, h:Q.hinted?1:0, s:Math.round((Date.now()-Q.t0)/1000)});
  if(S.log.length>400) S.log=S.log.slice(-400);
  save();
}

function endRound(){
  const good=R.results.filter(Boolean).length, l=R.lvl;
  S.best[l]=Math.max(S.best[l]||0, good);
  const pass = good>=6, wasNew = pass && !S.done[l] && l<3;
  if(pass) S.done[l]=1;
  save(); pipsUI();
  $("#celeArt").innerHTML=ITEMS[pass?"diamond":"emerald"];
  $("#celeText").innerHTML = `סִיַּמְתָּ!<br>${good} מִתּוֹךְ ${ROUND} בְּנִסָּיוֹן רִאשׁוֹן` + (wasNew?`<br>נִפְתַּח שָׁלָב חָדָשׁ: ${LEVELS[l+1].name}`:"");
  $("#cele").classList.add("on");
  $("#celeOk").onclick=()=>{ $("#cele").classList.remove("on"); renderHome(); show("home"); };
}

$("#homeBtn").onclick=()=>{ if(busy) return; renderHome(); show("home"); };

/* ---------- read aloud (Hebrew voice if the tablet has one) ---------- */
$("#say").onclick=()=>{ try{ speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(Q.t.lines(Q.a,Q.b).join(" ")+" "+Q.t.q); u.lang="he-IL"; u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/^he|^iw/i.test(v.lang)); if(v) u.voice=v;
  speechSynthesis.speak(u); }catch(e){} };

/* ---------- parent panel ---------- */
function renderStats(){
  const rows=[1,2,3].map(l=>{ const L=S.log.filter(x=>x.l===l); if(!L.length) return "";
    const right=L.filter(x=>x.v===x.ans).length;
    const misses=L.filter(x=>x.v!==x.ans).slice(-8).map(x=>`<span class="miss">${x.op==="fill"?`${x.a} + ? = 10`:`${x.a} ${x.op==="+"?"+":"−"} ${x.b}`} → ${x.v}</span>`).join("");
    return `<div><b>${LEVELS[l].name}</b>: ${L.length} תשובות, ${Math.round(100*right/L.length)}% נכונות${misses?`<br>טעויות אחרונות: ${misses}`:""}</div>`; }).join("");
  $("#stats").innerHTML = rows || "עוד אין תשובות.";
}
$("#parentBtn").onclick=()=>{ $("#optUnlock").checked=!!S.unlockAll; $("#optSpeed").value=String(S.speed||1); $("#optAfter").checked=!!S.animAfter; renderStats(); $("#parent").classList.add("on"); };
$("#parentClose").onclick=()=>{ S.unlockAll=$("#optUnlock").checked; S.speed=parseFloat($("#optSpeed").value); S.animAfter=$("#optAfter").checked; save(); $("#parent").classList.remove("on"); renderHome(); };
$("#resetBtn").onclick=()=>{ if(!confirm("לאפס את כל ההתקדמות?")) return; S=blank(); save(); $("#parent").classList.remove("on"); renderHome(); };
$("#fsBtn").onclick=()=>{ const d=document.documentElement; (document.fullscreenElement? document.exitFullscreen() : d.requestFullscreen&&d.requestFullscreen())?.catch?.(()=>{}); };

buildPad(); renderHome();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
